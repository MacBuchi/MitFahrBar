<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 0 120 100" width="100%" height="100%" style="display:block" aria-label="RideBuddy">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"></stop>
      <stop offset="1" stop-color="#22d3ee"></stop>
    </linearGradient>
  </defs>
  <g fill="{{ streakColor }}" opacity="0.9">
    <rect x="106" y="38" width="20" height="5" rx="2.5"></rect>
    <rect x="108" y="54" width="18" height="5" rx="2.5"></rect>
    <rect x="106" y="70" width="19" height="5" rx="2.5"></rect>
  </g>
  <g transform="translate(-10,0)">
    <circle cx="36" cy="80" r="12" fill="{{ wheelColor }}"></circle>
    <circle cx="92" cy="80" r="12" fill="{{ wheelColor }}"></circle>
    <circle cx="36" cy="80" r="5" fill="{{ hubColor }}"></circle>
    <circle cx="92" cy="80" r="5" fill="{{ hubColor }}"></circle>
    <rect x="12" y="54" width="102" height="24" rx="11" fill="{{ bodyColor }}"></rect>
    <rect x="26" y="31" width="84" height="27" rx="9" fill="{{ bodyColor }}"></rect>
    <rect x="32" y="37" width="72" height="15" rx="5" fill="{{ windowColor }}"></rect>
    <rect x="60" y="35" width="4" height="19" rx="2" fill="{{ bodyColor }}"></rect>
    <rect x="83" y="35" width="4" height="19" rx="2" fill="{{ bodyColor }}"></rect>
    <circle cx="45" cy="45" r="5" fill="{{ headColor }}"></circle>
    <circle cx="72" cy="45" r="5" fill="{{ headColor }}"></circle>
    <circle cx="95" cy="45" r="5" fill="{{ headColor }}"></circle>
    <rect x="11" y="57" width="7" height="10" rx="3" fill="#facc15"></rect>
    <rect x="108" y="57" width="6" height="10" rx="3" fill="#ef4444"></rect>
  </g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:180},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;gradient&quot;,&quot;ink&quot;,&quot;white&quot;],&quot;default&quot;:&quot;gradient&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'gradient';
    const sets = {
      gradient: { bodyColor: 'url(#rbg)', windowColor: '#ffffff', headColor: '#0891b2', wheelColor: '#1a1030', hubColor: '#67e8f9', streakColor: '#22d3ee' },
      ink:      { bodyColor: '#0c3038', windowColor: '#ecfeff', headColor: '#0891b2', wheelColor: '#04161b', hubColor: '#0e5661', streakColor: '#0891b2' },
      white:    { bodyColor: '#ffffff', windowColor: '#0891b2', headColor: '#ffffff', wheelColor: '#ffffff', hubColor: '#0891b2', streakColor: 'rgba(255,255,255,0.55)' },
    };
    return sets[v] || sets.gradient;
  }
}
</script>
</body>
</html>
