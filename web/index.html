<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Die faire App für eure Fahrgemeinschaft — Fahrten dokumentieren, Punkte zählen, wissen wer als Nächstes dran ist.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Muss zu `theme_color` in manifest.json passen: Der Browser nimmt
       diese Angabe, die installierte PWA die aus dem Manifest. -->
  <meta name="theme-color" content="#0F7F98">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MitFahrBar">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MitFahrBar</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Der App-Worker wird HIER registriert, nicht über den Bootstrap (#232).

    Gemessen am 10.08.2026 im Browser-E2E gegen einen echten Stack: Im
    ausgelieferten Bau stand im Geltungsbereich „/" genau ein Service
    Worker, nämlich der von Firebase, die Cache-Ablage war leer, und ein
    Neuladen ohne Netz endete in ERR_INTERNET_DISCONNECTED — die PWA
    startete ohne Empfang also gar nicht, und der Zwischenspeicher aus
    v0.79.0 lag hinter einer verschlossenen Tür.

    Die Gegenprobe ohne Firebase im Bau zeigte GAR KEINEN Worker. Es ist
    also keine Verdrängung: Flutters eigener Ladeweg registriert in 3.44
    nichts mehr, `flutter_bootstrap.js` führt ihn selbst als deprecated.
    Deshalb diese vier Zeilen — sie ersetzen einen Weg, der aufgegeben
    wurde, nicht einen, der funktioniert.

    Der Pfad ist relativ und löst gegen das <base href> auf, das Flutter
    aus `--base-href` schreibt (auf Pages „/MitFahrBar/"); ein absoluter
    Pfad wäre eine zweite Stelle, die mit release.yml synchron bleiben
    müsste — dieselbe Falle wie beim Push-Worker, siehe
    `webServiceWorkerPath`.

    Und er gehört mit `--no-web-resources-cdn` zusammen: Holt der Bau
    CanvasKit von gstatic, hält kein Worker den Renderer vor, und die
    Seite käme ohne Netz zwar an, bliebe aber weiß.
  -->
  <script>
    window.addEventListener('load', function () {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('flutter_service_worker.js');
      }
    });
  </script>
</body>
</html>
