# Statische Analyse. Das Warum steht im DocuHub; hier nur, was für MitFahrBar
# zusätzlich gilt.
#
# NICHT eintragen: `require_trailing_commas` — die Regel gibt es seit Dart 3.7
# nicht mehr (der Formatter setzt die Kommas selbst), ein Eintrag erzeugt eine
# „undefined lint rule" und damit rote CI.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    # Beide Regeln sind über flutter_lints ohnehin aktiv und blockieren die
    # CI schon heute (flutter analyze endet auch bei Info ungleich null). Die
    # Hochstufung macht im Editor sichtbar, dass es Leitplanken sind und
    # keine Anregungen — siehe CLAUDE.md.
    avoid_print: error
    use_build_context_synchronously: error

linter:
  rules:
    # Ein vergessenes await auf einem Repository-Aufruf schlägt still fehl:
    # Der Fehler landet im Nichts, die UI meldet Erfolg.
    - unawaited_futures
    - prefer_const_constructors
    - prefer_final_locals
