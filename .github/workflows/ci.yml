name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ältere Läufe desselben Branches abbrechen, sobald neu gepusht wird.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Formatierung prüfen
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

      # Die Data-Safety-CSV ist erzeugt, nicht gepflegt: Antworten stehen in
      # tool/play_data_safety.py, die inhaltliche Begründung in
      # doc/play-console.md. Ohne diesen Schritt liefen beide auseinander,
      # ohne dass irgendetwas rot wird — und auffallen würde es erst, wenn
      # Play das Formular gegen das Binary hält.
      - name: Datensicherheits-CSV ist deckungsgleich
        run: python3 tool/play_data_safety.py --check

      # Der Nachfüller liest eine Woche EINMAL und bedient daraus alle
      # Gebiete (doc/entscheidung-preisnetz.md). Die Prüfung beweist, dass
      # das dieselben Wochenwerte liefert wie getrennte Läufe — ein
      # schnellerer Lauf mit anderen Zahlen wäre kein Fortschritt, sondern
      # eine stille Verschiebung der Ersparnis aller Gruppen. Läuft ohne
      # Netz und ohne Datenbank, deshalb hier und nicht im nächtlichen Job.
      - name: Preis-Nachfüller rechnet geteilt wie getrennt
        run: python3 tool/import_fuel_history.py --self-check

      # Die fünf Edge Functions hatten bis hierher GAR KEINEN Compile-Schritt.
      # Ein Syntaxfehler dort fällt sonst erst live auf, und zwar als
      # Function, die nie startet — die GitHub-Integration deployt bei jedem
      # Push auf `main`, ohne vorher zu übersetzen. FWApp hat denselben
      # Schritt und dokumentiert dort den echten Ausfall, der ihn ausgelöst
      # hat (v1.9.0, fehlendes „+", Nutzerverwaltung tot).
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Edge Functions übersetzen
        run: deno check supabase/functions/*/index.ts

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # --no-web-resources-cdn: Der Renderer muss aus dem Build kommen. Von
      # gstatic nachgeladen kann ihn kein Service Worker vorhalten, und die
      # PWA startet ohne Empfang zwar — bleibt aber weiß (#232).
      - run: flutter build web --release --base-href /MitFahrBar/ --no-web-resources-cdn
      - run: python3 tool/inject_sw_manifest.py
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Ohne key.properties fällt der Build auf Debug-Signing zurück — für
      # den Kompilier-Check reicht das; signiert wird im Release-Workflow.
      #
      # Bewusst der `play`-Flavor, obwohl veröffentlicht die GitHub-APK wird:
      # `github` baut aus `src/main` und damit exakt wie vor den Flavors —
      # neu ist allein das Zusammenführen von `src/play/AndroidManifest.xml`,
      # und das soll HIER brechen und nicht in release.yml, wo der Tag schon
      # steht (v0.34.1: ein Tag ohne Release ist nur von Hand zu heilen).
      - run: flutter build apk --release --flavor play
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk-play
          path: build/app/outputs/flutter-apk/app-play-release.apk
          retention-days: 14

  e2e:
    name: E2E (Supabase-Stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # CLI-Version gepinnt wie Flutter — ein CLI-Upgrade ändert den
      # lokalen Stack (Ports/Sektionen in config.toml) und gehört bewusst
      # zusammen mit einem lokalen Upgrade getestet.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: "2.109.1"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Startet den lokalen Stack (Docker ist auf ubuntu-latest vorhanden),
      # spielt alle Migrationen ein und fährt test/e2e/ dagegen — echte RLS,
      # echte Auth-Mails (Mailpit). Ohne Stack überspringen sich die Tests.
      - name: E2E-Tests gegen lokalen Stack
        run: tool/e2e.sh

  # Browser-E2E (Issue #71): Playwright fährt die ECHTE Web-App im echten
  # Browser gegen den lokalen Stack — Registrieren, Bestätigungs-Mail aus
  # Mailpit, zurück in die App, Gruppe verknüpfen. Die letzte Naht, die
  # Widget-Tests (Fakes) und Dart-E2E (Backend) nicht abdecken. Bewusst
  # KEIN Required Check (koordinatenbasiert auf dem Canvas, siehe
  # console.mjs) — rot heißt: Screenshots im Artifact ansehen.
  browser-e2e:
    name: Browser E2E (Konsole)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: "2.109.1"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Browser-E2E gegen lokalen Stack
        run: tool/browser_e2e.sh
      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-shots
          path: tool/browser_e2e/shots/
          retention-days: 14
          if-no-files-found: ignore

  # Browser-E2E Offline (#169, #232): dieselbe Maschinerie, andere Frage —
  # startet die App mit UND ohne Netz. Das ist die einzige Stelle, an der das
  # „Netz" wirklich am Socket abgeschaltet wird; in den Flow-Tests hängt es
  # an der Repository-Naht. Damit laufen hier die echte Ablage im Browser,
  # der echte Fehler des Supabase-Clients und der Service Worker mit — ohne
  # den lädt die PWA ohne Empfang gar nicht erst, und das sieht sonst niemand.
  #
  # **Required Check seit v0.80.0.** Bis dahin war er bewusst keiner: Er
  # beschrieb einen echten Defekt und war rot. Seit die PWA ohne Empfang
  # startet, beschreibt er einen Zustand, der halten soll — und genau das
  # kann kein Flow-Test bewachen, weil dort das „Netz" an der
  # Repository-Naht hängt und nicht am Socket.
  #
  # Der Name unten ist damit Teil der Branch Protection: Umbenennen greift
  # stillschweigend nicht mehr und muss zusammen mit den Repo-Einstellungen
  # passieren.
  browser-e2e-offline:
    name: Browser E2E (Offline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: "2.109.1"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Start mit und ohne Netz gegen lokalen Stack
        run: tool/browser_e2e.sh offline
      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-offline-shots
          path: tool/browser_e2e/shots/
          retention-days: 14
          if-no-files-found: ignore

  housekeeping:
    name: Version Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Versions-Bump prüfen
        # Über `env:` statt direkt in den `run:`-Block interpoliert: Ein
        # Branch-Name ist von außen wählbar, und `${{ }}` wird VOR der Shell
        # ersetzt — ein Branch namens `a";rm -rf /;#` liefe sonst als Code.
        # In der Umgebungsvariable ist er nur noch eine Zeichenkette.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          latest=$(git tag -l 'v*' | sort -V | tail -1)
          echo "pubspec: $version — letzter Tag: ${latest:-keiner}"
          if [ -z "$latest" ]; then
            echo "Noch kein Release-Tag — nichts zu prüfen."
            exit 0
          fi
          if [ "$(printf '%s\n' "${latest#v}" "$version" | sort -V | tail -1)" != "$version" ] \
             || [ "${latest#v}" = "$version" ]; then
            # Doku, CI-Konfiguration, Tests und Tooling lösen keinen Release
            # aus. `doc/` steht mit drin, weil dort auch Nicht-Markdown liegt
            # (README-Screenshots) — Doku bleibt Doku, auch als PNG.
            excludes=(':!*.md' ':!.github' ':!doc' ':!test' ':!tool' ':!LICENSE')
            if [ "$EVENT_NAME" = "pull_request" ]; then
              changed=$(git diff --name-only "origin/$BASE_REF"...HEAD -- . "${excludes[@]}" || true)
            else
              changed=$(git diff --name-only "$latest"..HEAD -- . "${excludes[@]}" || true)
            fi
            if [ -n "$changed" ]; then
              echo "::error::Code geändert, aber version in pubspec.yaml ($version) ist nicht größer als $latest. Bitte Version bumpen (beide Teile, z. B. 1.2.3+4 → 1.2.4+5) — ohne Bump gibt es kein Release."
              exit 1
            fi
          fi
