name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ältere Läufe desselben Branches abbrechen, sobald neu gepusht wird.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Formatierung prüfen
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

      # Die fünf Edge Functions hatten bis hierher GAR KEINEN Compile-Schritt.
      # Ein Syntaxfehler dort fällt sonst erst live auf, und zwar als
      # Function, die nie startet — die GitHub-Integration deployt bei jedem
      # Push auf `main`, ohne vorher zu übersetzen. FWApp hat denselben
      # Schritt und dokumentiert dort den echten Ausfall, der ihn ausgelöst
      # hat (v1.9.0, fehlendes „+", Nutzerverwaltung tot).
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x
      - name: Edge Functions übersetzen
        run: deno check supabase/functions/*/index.ts

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /MitFahrBar/
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Ohne key.properties fällt der Build auf Debug-Signing zurück — für
      # den Kompilier-Check reicht das; signiert wird im Release-Workflow.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  e2e:
    name: E2E (Supabase-Stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # CLI-Version gepinnt wie Flutter — ein CLI-Upgrade ändert den
      # lokalen Stack (Ports/Sektionen in config.toml) und gehört bewusst
      # zusammen mit einem lokalen Upgrade getestet.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: "2.109.1"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Startet den lokalen Stack (Docker ist auf ubuntu-latest vorhanden),
      # spielt alle Migrationen ein und fährt test/e2e/ dagegen — echte RLS,
      # echte Auth-Mails (Mailpit). Ohne Stack überspringen sich die Tests.
      - name: E2E-Tests gegen lokalen Stack
        run: tool/e2e.sh

  # Browser-E2E (Issue #71): Playwright fährt die ECHTE Web-App im echten
  # Browser gegen den lokalen Stack — Registrieren, Bestätigungs-Mail aus
  # Mailpit, zurück in die App, Gruppe verknüpfen. Die letzte Naht, die
  # Widget-Tests (Fakes) und Dart-E2E (Backend) nicht abdecken. Bewusst
  # KEIN Required Check (koordinatenbasiert auf dem Canvas, siehe
  # console.mjs) — rot heißt: Screenshots im Artifact ansehen.
  browser-e2e:
    name: Browser E2E (Konsole)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: "2.109.1"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Browser-E2E gegen lokalen Stack
        run: tool/browser_e2e.sh
      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-shots
          path: tool/browser_e2e/shots/
          retention-days: 14
          if-no-files-found: ignore

  housekeeping:
    name: Version Guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Versions-Bump prüfen
        # Über `env:` statt direkt in den `run:`-Block interpoliert: Ein
        # Branch-Name ist von außen wählbar, und `${{ }}` wird VOR der Shell
        # ersetzt — ein Branch namens `a";rm -rf /;#` liefe sonst als Code.
        # In der Umgebungsvariable ist er nur noch eine Zeichenkette.
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          latest=$(git tag -l 'v*' | sort -V | tail -1)
          echo "pubspec: $version — letzter Tag: ${latest:-keiner}"
          if [ -z "$latest" ]; then
            echo "Noch kein Release-Tag — nichts zu prüfen."
            exit 0
          fi
          if [ "$(printf '%s\n' "${latest#v}" "$version" | sort -V | tail -1)" != "$version" ] \
             || [ "${latest#v}" = "$version" ]; then
            # Doku, CI-Konfiguration, Tests und Tooling lösen keinen Release
            # aus. `doc/` steht mit drin, weil dort auch Nicht-Markdown liegt
            # (README-Screenshots) — Doku bleibt Doku, auch als PNG.
            excludes=(':!*.md' ':!.github' ':!doc' ':!test' ':!tool' ':!LICENSE')
            if [ "$EVENT_NAME" = "pull_request" ]; then
              changed=$(git diff --name-only "origin/$BASE_REF"...HEAD -- . "${excludes[@]}" || true)
            else
              changed=$(git diff --name-only "$latest"..HEAD -- . "${excludes[@]}" || true)
            fi
            if [ -n "$changed" ]; then
              echo "::error::Code geändert, aber version in pubspec.yaml ($version) ist nicht größer als $latest. Bitte Version bumpen (beide Teile, z. B. 1.2.3+4 → 1.2.4+5) — ohne Bump gibt es kein Release."
              exit 1
            fi
          fi
