name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Ältere Läufe desselben Branches abbrechen, sobald neu gepusht wird.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.2"

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Formatierung prüfen
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /Fahrgemeinschaft/
      - uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Ohne key.properties fällt der Build auf Debug-Signing zurück — für
      # den Kompilier-Check reicht das; signiert wird im Release-Workflow.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  e2e:
    name: E2E (Supabase-Stack)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # CLI-Version gepinnt wie Flutter — ein CLI-Upgrade ändert den
      # lokalen Stack (Ports/Sektionen in config.toml) und gehört bewusst
      # zusammen mit einem lokalen Upgrade getestet.
      - uses: supabase/setup-cli@v1
        with:
          version: "2.109.1"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Startet den lokalen Stack (Docker ist auf ubuntu-latest vorhanden),
      # spielt alle Migrationen ein und fährt test/e2e/ dagegen — echte RLS,
      # echte Auth-Mails (Mailpit). Ohne Stack überspringen sich die Tests.
      - name: E2E-Tests gegen lokalen Stack
        run: tool/e2e.sh

    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Versions-Bump prüfen
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          latest=$(git tag -l 'v*' | sort -V | tail -1)
          echo "pubspec: $version — letzter Tag: ${latest:-keiner}"
          if [ -z "$latest" ]; then
            echo "Noch kein Release-Tag — nichts zu prüfen."
            exit 0
          fi
          if [ "$(printf '%s\n' "${latest#v}" "$version" | sort -V | tail -1)" != "$version" ] \
             || [ "${latest#v}" = "$version" ]; then
            # Doku, CI-Konfiguration, Tests und Tooling lösen keinen Release aus.
            excludes=(':!*.md' ':!.github' ':!test' ':!tool' ':!LICENSE')
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              changed=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- . "${excludes[@]}" || true)
            else
              changed=$(git diff --name-only "$latest"..HEAD -- . "${excludes[@]}" || true)
            fi
            if [ -n "$changed" ]; then
              echo "::error::Code geändert, aber version in pubspec.yaml ($version) ist nicht größer als $latest. Bitte Version bumpen (beide Teile, z. B. 1.2.3+4 → 1.2.4+5) — ohne Bump gibt es kein Release."
              exit 1
            fi
          fi
