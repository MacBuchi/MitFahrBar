name: Release

# Version bump in pubspec.yaml on main -> tag v<version>, signed APK,
# GitHub release and web deploy. No bump = no release.
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.44.8"

jobs:
  version:
    name: Determine release tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Erst entscheiden, ob überhaupt veröffentlicht wird — der Tag wird hier
      # noch NICHT gesetzt, damit das Qualitäts-Gate davor laufen kann.
      - id: decide
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag existiert schon — kein neues Release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "needs_tag=true" >> "$GITHUB_OUTPUT"
          fi
      # Qualitäts-Gate: Der Merge auf main ist die Veröffentlichung, und
      # `enforce_admins` ist aus — ein direkter Push am Branch-Schutz vorbei
      # käme sonst ungeprüft bis in Tag, APK und Pages-Deploy. Läuft nur, wenn
      # tatsächlich released wird, damit Doku-Pushes schnell bleiben.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.decide.outputs.release == 'true'
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Abhängigkeiten holen
        if: steps.decide.outputs.release == 'true'
        run: flutter pub get
      - name: Analyze
        if: steps.decide.outputs.release == 'true'
        run: flutter analyze
      - name: Test
        if: steps.decide.outputs.release == 'true'
        run: flutter test
      # Erst jetzt taggen: Ab hier ist die Version öffentlich.
      - name: Tag setzen
        if: steps.decide.outputs.release == 'true' && steps.decide.outputs.needs_tag == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  build-android:
    name: Build Android APK (signed)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Ohne stabilen Keystore wird bewusst KEINE APK veröffentlicht: ein
      # wechselnder (Debug-)Schlüssel macht jedes Update auf den Geräten zum
      # Signatur-Konflikt. Bis ein Keystore hinterlegt ist, erscheint das
      # Release web-only.
      - name: Keystore vorhanden?
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Kein ANDROID_KEYSTORE_BASE64 hinterlegt — Release ohne APK."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write signing config
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > android/fahrgemeinschaft-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=fahrgemeinschaft-release.jks
          EOF
      # `--flavor github` behält REQUEST_INSTALL_PACKAGES: Genau dieser Weg
      # aktualisiert sich selbst aus dem GitHub-Release.
      - name: Build signed APK
        if: steps.keystore.outputs.present == 'true'
        run: |
          flutter build apk --release --flavor github
          cp build/app/outputs/flutter-apk/app-github-release.apk \
             "mitfahrbar-${{ needs.version.outputs.tag }}.apk"
      - uses: actions/upload-artifact@v7
        if: steps.keystore.outputs.present == 'true'
        with:
          name: android-apk
          # Muss zum cp-Ziel oben passen. Genau hier riss v0.34.1 ab: Beim
          # Umbenennen auf mitfahrbar-*.apk wurde nur der cp-Schritt
          # angepasst — Upload und Release-Dateiliste suchten weiter den
          # alten Namen, der Lauf starb NACH dem Taggen und hinterließ
          # einen Tag ohne Release (den die Tag-Entscheidung dann für
          # immer als „schon veröffentlicht" wertete).
          path: mitfahrbar-${{ needs.version.outputs.tag }}.apk
          if-no-files-found: error
      # AAB für den Play Store — dasselbe Signing wie die APK. Bewusst NICHT
      # am GitHub-Release: ein .aab lässt sich nicht installieren und würde
      # neben der APK nur verwirren. Liegt als Workflow-Artefakt bereit.
      #
      # PLAY_BUILD=true schaltet den kompletten Update-Pfad ab (Riegel im
      # Provider, core/app_distribution.dart), und `--flavor play` nimmt
      # REQUEST_INSTALL_PACKAGES aus dem Manifest — zwei Hälften derselben
      # Entscheidung: Wer nur eine setzt, liefert eine halb abgeschaltete
      # Funktion aus, und Play fragt nach der Berechtigung ohne Funktion.
      - name: Build Play bundle (AAB)
        if: steps.keystore.outputs.present == 'true'
        run: |
          flutter build appbundle --release --flavor play --dart-define=PLAY_BUILD=true
          cp build/app/outputs/bundle/playRelease/app-play-release.aab \
             "mitfahrbar-${{ needs.version.outputs.tag }}.aab"
      - uses: actions/upload-artifact@v7
        if: steps.keystore.outputs.present == 'true'
        with:
          name: android-aab
          path: mitfahrbar-${{ needs.version.outputs.tag }}.aab
          if-no-files-found: error
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [version, build-android]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Es kann (noch) keine APK geben — dann bleibt das Release web-only.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          merge-multiple: true
      # Release-Body = der deutsche CHANGELOG-Abschnitt der Version. Die App
      # zeigt den Body wortwörtlich im Update-Dialog — auto-generierte
      # englische PR-Titel wären dort Entwickler-Kauderwelsch (Gerätetest
      # 2026-07-21). Fehlt der Abschnitt, gibt es einen Link statt Leere.
      - name: Release-Notes aus CHANGELOG schneiden
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { hit = 1; next }
            hit && /^## \[/ { exit }
            hit { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::warning::Kein CHANGELOG-Abschnitt für $version — Fallback-Link."
            echo "Details: https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md" > release-body.md
          fi
          cat release-body.md
      # **Jeder Merge erzeugt ein PRERELEASE, nie „latest".** Das ist der
      # ganze Kanal-Trick: `update_check.dart` fragt
      # `/releases/latest` ab, und GitHub liefert dort grundsätzlich keine
      # Prereleases — weder den Versionshinweis noch das APK fürs
      # In-App-Update. Die Gruppe sieht also nichts, bis `promote.yml` eines
      # dieser Releases befördert.
      #
      # `make_latest: false` ist dabei kein Beiwerk: Ohne die Zeile setzt
      # GitHub das neueste Release trotzdem als „latest", auch ein
      # Prerelease-markiertes.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: release-body.md
          files: mitfahrbar-*.apk
          fail_on_unmatched_files: false
          prerelease: true
          make_latest: false

  # Das AAB in den internen Play-Testkanal — Muster von PilzBuddy (#251),
  # dort seit 2026-08-13 im Einsatz: „das AAB nie wieder von Hand anfassen".
  #
  # **Als Entwurf, nicht veröffentlicht.** Sichtbar wird ein Stand erst, wenn
  # ihn jemand in der Console freigibt — dieselbe Trennung wie zwischen
  # Prerelease und `promote.yml`. Ein Bump lädt hoch, ein Mensch entscheidet,
  # wer es bekommt. Ein anderer Kanal ist ein Wort in `track:`.
  #
  # **Ein eigener Job NACH dem Release, und das ist die Abweichung von
  # PilzBuddy.** Dort hängt der Upload im Build-Job, den das Release braucht;
  # eine 503 von Google ließe damit einen Tag ohne Release zurück — genau die
  # v0.34.1-Klasse, die die Tag-Entscheidung anschließend für immer als
  # „schon veröffentlicht" wertet. Hier kann ein Play-Problem nur den
  # Play-Schritt kosten; der Lauf ist rot, das Release steht, und ein
  # Wiederholen des Jobs holt es nach (das Artefakt liegt 90 Tage).
  play:
    name: Upload to Play (internal, draft)
    needs: [version, release]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Ohne Keystore gibt es kein AAB — dann ist hier nichts zu tun.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: android-aab
      # Der `secrets`-Kontext ist in `if:` NICHT verfügbar. GitHub verwirft
      # dann die ganze Datei schon beim Einlesen („workflow file issue", null
      # Jobs) — bei JEDEM Push, weil nicht einmal die Filter ausgewertet
      # werden. Genau so lag PilzBuddys deploy-functions.yml von der ersten
      # Zeile an lahm und verhinderte dort einen Release-Build. Deshalb der
      # Umweg: Ein Schritt stellt das Vorhandensein fest (in `env:` sind
      # Secrets erlaubt), die anderen prüfen sein Ergebnis.
      - name: Play-Zugang und Bundle vorhanden?
        id: play
        env:
          SA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$SA" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "why=PLAY_SERVICE_ACCOUNT_JSON fehlt" >> "$GITHUB_OUTPUT"
          elif ! ls mitfahrbar-*.aab >/dev/null 2>&1; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "why=kein AAB am Lauf (fehlender Keystore?)" >> "$GITHUB_OUTPUT"
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi
      # Play deckelt Release-Notizen bei **500 Zeichen** und lehnt sonst ab —
      # und zwar erst NACH dem 60-MB-Transfer. Gekürzt wird deshalb vorher,
      # an einer Wortgrenze, mit sichtbarem Verweis aufs Ganze. Quelle ist
      # derselbe CHANGELOG-Abschnitt wie „Was ist neu" im GitHub-Release —
      # zwei Wortlaute für eine Version wären zwei Wahrheiten.
      - name: Release-Notizen für Play vorbereiten
        if: steps.play.outputs.have == 'true'
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p play-notes
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { hit = 1; next }
            hit && /^## \[/ { exit }
            hit { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > play-notes/raw.md
          python3 - <<'PY'
          import pathlib, re
          raw = pathlib.Path("play-notes/raw.md").read_text()
          # Markdown-Reste weg: Play zeigt reinen Text, `**` und `-` sähen
          # aus wie Tippfehler.
          text = re.sub(r"\*\*|`", "", raw)
          text = re.sub(r"^\s*[-*] ", "• ", text, flags=re.M)
          text = re.sub(r"^###.*$", "", text, flags=re.M)
          # Umbrüche INNERHALB eines Absatzes auflösen: Der CHANGELOG ist auf
          # 76 Zeichen umbrochen, und auf einem Handy läse sich das zerhackt.
          # Leerzeilen bleiben als Absatzgrenze stehen.
          text = re.sub(r"(?<!\n)\n(?![\n•])[ \t]*", " ", text)
          text = re.sub(r"\n{3,}", "\n\n", text).strip()
          limit = 500
          if len(text) > limit:
              tail = " … Alle Änderungen: github.com/MacBuchi/MitFahrBar"
              cut = text[: limit - len(tail)]
              text = cut[: cut.rfind(" ")] + tail
          pathlib.Path("play-notes/whatsnew-de-DE").write_text(text)
          print(f"Notizen: {len(text)} Zeichen")
          PY
          rm play-notes/raw.md
          cat play-notes/whatsnew-de-DE
      - name: Upload to Play internal testing
        if: steps.play.outputs.have == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # In Play dauerhaft an die App gebunden — ein Vertipper lädt ins
          # Leere oder in eine fremde App.
          packageName: de.mcbuchi.mitfahrbar
          releaseFiles: mitfahrbar-${{ needs.version.outputs.tag }}.aab
          track: internal
          status: draft
          whatsNewDirectory: play-notes
      # Der Grund geht über `env:` in den Block, nicht als `${{ }}` mitten in
      # die Shell — dieselbe Entschärfung, die zizmor hier schon zweimal
      # verlangt hat (Branch-Name, Cron-String).
      - name: Play-Upload übersprungen
        if: steps.play.outputs.have == 'false'
        env:
          WHY: ${{ steps.play.outputs.why }}
        run: |
          {
            echo "### Nicht zu Play hochgeladen — $WHY"
            echo ""
            echo "Einrichtung: doc/play-console.md, Abschnitt „Upload aus der CI\"."
          } >> "$GITHUB_STEP_SUMMARY"
