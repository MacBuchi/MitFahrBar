name: Release

# Version bump in pubspec.yaml on main -> tag v<version>, signed APK,
# GitHub release and web deploy. No bump = no release.
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.2"

jobs:
  version:
    name: Determine release tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Erst entscheiden, ob überhaupt veröffentlicht wird — der Tag wird hier
      # noch NICHT gesetzt, damit das Qualitäts-Gate davor laufen kann.
      - id: decide
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "needs_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^version: \([0-9][0-9.]*\).*/\1/p' pubspec.yaml)
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag existiert schon — kein neues Release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "needs_tag=true" >> "$GITHUB_OUTPUT"
          fi
      # Qualitäts-Gate: Der Merge auf main ist die Veröffentlichung, und
      # `enforce_admins` ist aus — ein direkter Push am Branch-Schutz vorbei
      # käme sonst ungeprüft bis in Tag, APK und Pages-Deploy. Läuft nur, wenn
      # tatsächlich released wird, damit Doku-Pushes schnell bleiben.
      - uses: subosito/flutter-action@v2
        if: steps.decide.outputs.release == 'true'
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Abhängigkeiten holen
        if: steps.decide.outputs.release == 'true'
        run: flutter pub get
      - name: Analyze
        if: steps.decide.outputs.release == 'true'
        run: flutter analyze
      - name: Test
        if: steps.decide.outputs.release == 'true'
        run: flutter test
      # Erst jetzt taggen: Ab hier ist die Version öffentlich.
      - name: Tag setzen
        if: steps.decide.outputs.release == 'true' && steps.decide.outputs.needs_tag == 'true'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  build-android:
    name: Build Android APK (signed)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Ohne stabilen Keystore wird bewusst KEINE APK veröffentlicht: ein
      # wechselnder (Debug-)Schlüssel macht jedes Update auf den Geräten zum
      # Signatur-Konflikt. Bis ein Keystore hinterlegt ist, erscheint das
      # Release web-only.
      - name: Keystore vorhanden?
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::notice::Kein ANDROID_KEYSTORE_BASE64 hinterlegt — Release ohne APK."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Write signing config
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > android/fahrgemeinschaft-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=fahrgemeinschaft-release.jks
          EOF
      - name: Build signed APK
        if: steps.keystore.outputs.present == 'true'
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
             "fahrgemeinschaft-${{ needs.version.outputs.tag }}.apk"
      - uses: actions/upload-artifact@v7
        if: steps.keystore.outputs.present == 'true'
        with:
          name: android-apk
          path: fahrgemeinschaft-${{ needs.version.outputs.tag }}.apk
          if-no-files-found: error

  deploy-web:
    name: Deploy Web (GitHub Pages)
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /Fahrgemeinschaft/
      # SPA-Fallback: GitHub Pages liefert 404.html bei Deep-Links.
      - run: cp build/web/index.html build/web/404.html
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          force_orphan: true

  release:
    name: Create GitHub Release
    needs: [version, build-android, deploy-web]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Es kann (noch) keine APK geben — dann bleibt das Release web-only.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          merge-multiple: true
      # Release-Body = der deutsche CHANGELOG-Abschnitt der Version. Die App
      # zeigt den Body wortwörtlich im Update-Dialog — auto-generierte
      # englische PR-Titel wären dort Entwickler-Kauderwelsch (Gerätetest
      # 2026-07-21). Fehlt der Abschnitt, gibt es einen Link statt Leere.
      - name: Release-Notes aus CHANGELOG schneiden
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { hit = 1; next }
            hit && /^## \[/ { exit }
            hit { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > release-body.md
          if [ ! -s release-body.md ]; then
            echo "::warning::Kein CHANGELOG-Abschnitt für $version — Fallback-Link."
            echo "Details: https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md" > release-body.md
          fi
          cat release-body.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body_path: release-body.md
          files: fahrgemeinschaft-*.apk
          fail_on_unmatched_files: false
