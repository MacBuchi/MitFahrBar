# Ein AAB in einen Play-Testkanal schieben (#242).
#
# **Warum aus der CI und nicht vom Rechner.** Das Bundle wiegt rund 60 MB.
# Vom Arbeitsplatz aus hängt der Upload an der Leitung, die dort gerade da
# ist; der Runner hat das Bundle ohnehin gebaut und schiebt es über eine
# Leitung weiter, die niemanden bremst. Ausgelöst wird von Hand — jeder
# Merge in einen Testkanal wäre eine Benachrichtigung an alle Tester.
#
# **Gebaut wird neu, statt das Release-Artefakt zu holen.** Artefakte
# verfallen nach 90 Tagen, und ein Lauf, der ein halbes Jahr später nicht
# mehr funktioniert, ist eine Falle. Aus dem Tag gebaut ist er reproduzierbar
# — dieselbe Entscheidung wie bei Pages in `promote.yml`.
#
# **Die Einrichtung ist einmalig und braucht Konsolen-Zugang** (Dienstkonto
# anlegen, in der Play Console berechtigen, Schlüssel als Geheimnis
# ablegen). Die Schritte stehen in `doc/play-console.md`.
name: Play Upload

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne v, z. B. 0.83.0 (leer = neuestes Release)'
        required: false
        type: string
      track:
        description: 'Kanal'
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: 'draft = nur hochladen, completed = an die Tester'
        required: true
        default: completed
        type: choice
        options: [completed, draft]

env:
  FLUTTER_VERSION: "3.44.8"

permissions:
  contents: read

jobs:
  upload:
    name: Upload to Play
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Ohne Dienstkonto endet der Lauf hier — mit einem Satz, der sagt was
      # fehlt. Dieselbe Linie wie beim Keystore in `release.yml`: lieber
      # sichtbar nichts tun als etwas Halbes.
      - name: Dienstkonto vorhanden?
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON fehlt. Einrichtung in doc/play-console.md, Abschnitt „Upload aus der CI\"."
            exit 1
          fi

      - name: Version bestimmen
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$WANTED" ]; then
            version="${WANTED#v}"
          else
            version=$(gh release list --limit 1 --exclude-drafts \
              --json tagName --jq '.[0].tagName' | sed 's/^v//')
          fi
          if [ -z "$version" ]; then
            echo "::error::Keine Version gefunden."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Auf den Tag wechseln
        run: git checkout "${{ steps.pick.outputs.tag }}"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get

      - name: Keystore einrichten
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 fehlt — ohne Signatur nimmt Play nichts an."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/fahrgemeinschaft-release.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=fahrgemeinschaft-release.jks
          EOF

      # Beide Hälften gehören zusammen, wie in release.yml: `--flavor play`
      # nimmt REQUEST_INSTALL_PACKAGES aus dem Manifest, PLAY_BUILD=true
      # schaltet den Update-Pfad ab. Nur eine davon liefert eine halb
      # abgeschaltete Funktion aus — und Play fragt nach einer Berechtigung,
      # die keine Funktion mehr hat.
      - name: Build Play bundle (AAB)
        run: |
          flutter build appbundle --release --flavor play --dart-define=PLAY_BUILD=true
          cp build/app/outputs/bundle/playRelease/app-play-release.aab \
             "mitfahrbar-${{ steps.pick.outputs.tag }}.aab"

      # Play nimmt Release-Notizen als Verzeichnis mit einer Datei je
      # Sprache — und deckelt sie bei **500 Zeichen**. Unsere
      # CHANGELOG-Abschnitte sind länger; ungekürzt lehnt die API den Upload
      # ab, und zwar erst nach dem 60-MB-Transfer. Deshalb hier kürzen, an
      # einer Wortgrenze, mit sichtbarem Verweis aufs Ganze.
      - name: Release-Notizen für Play vorbereiten
        env:
          VERSION: ${{ steps.pick.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p play-notes
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { hit = 1; next }
            hit && /^## \[/ { exit }
            hit { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > play-notes/raw.md
          python3 - <<'PY'
          import pathlib, re, textwrap
          raw = pathlib.Path("play-notes/raw.md").read_text()
          # Markdown-Reste weg: Play zeigt reinen Text, `**` und `-` sähen
          # aus wie Tippfehler.
          text = re.sub(r"\*\*|`", "", raw)
          text = re.sub(r"^\s*[-*] ", "• ", text, flags=re.M)
          text = re.sub(r"^###.*$", "", text, flags=re.M)
          # Umbrüche INNERHALB eines Absatzes auflösen: Der CHANGELOG ist auf
          # 76 Zeichen umbrochen, und auf einem Handy läse sich das zerhackt.
          # Leerzeilen bleiben als Absatzgrenze stehen.
          text = re.sub(r"(?<!\n)\n(?![\n•])[ \t]*", " ", text)
          text = re.sub(r"\n{3,}", "\n\n", text).strip()
          limit = 500
          if len(text) > limit:
              tail = " … Alle Änderungen: github.com/MacBuchi/MitFahrBar"
              cut = text[: limit - len(tail)]
              cut = cut[: cut.rfind(" ")]
              text = cut + tail
          pathlib.Path("play-notes/whatsnew-de-DE").write_text(text)
          print(f"Notizen: {len(text)} Zeichen")
          PY
          rm play-notes/raw.md
          cat play-notes/whatsnew-de-DE

      - name: Hochladen
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.mcbuchi.mitfahrbar
          releaseFiles: mitfahrbar-${{ steps.pick.outputs.tag }}.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          # Die Notizen kommen aus dem CHANGELOG-Abschnitt der Version —
          # dieselbe Quelle wie „Was ist neu" im GitHub-Release. Zwei
          # Wortlaute für dieselbe Version wären zwei Wahrheiten.
          whatsNewDirectory: play-notes

      - name: Ergebnis
        run: |
          echo "Hochgeladen: ${{ steps.pick.outputs.tag }} → ${{ inputs.track }} (${{ inputs.status }})"
