name: Push-Benachrichtigungen

# Hält den Ausgangskorb in Ordnung (Issues #101, #132). **Verschickt seit
# #132 nichts mehr** — das tut die Datenbank (pg_cron → `flush-push`). Ruht,
# solange die Secrets nicht gesetzt sind.
on:
  schedule:
    # Stündlich statt sechsmal je Stunde: Dieser Lauf ist nur noch der
    # Boden unter dem schnellen Weg. Er rechnet den Korb neu und repariert,
    # was ein Gerät ohne Netz oder ein geschlossener Tab hinterlassen hat —
    # verschickt wird binnen einer Minute nach der Änderung, nicht hier.
    #
    # Der Minuten-Offset bleibt: GitHub verzögert Läufe zur vollen Stunde
    # regelmäßig um 5 bis 30 Minuten, nahe der halben Stunde deutlich
    # weniger. Und das Fenster bleibt (UTC ≈ 16:00–11:00 Berlin) — außerhalb
    # gibt es nichts zu reparieren, was nicht bis zum Abend Zeit hätte.
    - cron: "23 14-23,0-9 * * *"
  workflow_dispatch:

# Zwei gleichzeitige Läufe schrieben dieselben Korb-Zeilen. Harmlos, aber der
# Trigger auf `push_outbox` vergliche dabei gegen einen halb geschriebenen
# Stand — und könnte eine Fälligkeit setzen, die es nicht gibt.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.2"
  # Ohne das rechnet der Job in UTC: Ein Runner steht auf UTC, `DateTime.now()`
  # und `DayTime.on()` in push_digest.dart aber sind lokale Zeit. Die
  # eingestellten 21:00 feuerten dann um 23 Uhr deutscher Zeit — im Sommer.
  # Sommerzeit gleich mit erledigt, weil die Zonendatenbank sie kennt.
  TZ: Europe/Berlin

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Flutter statt nur Dart, weil die pubspec am Flutter-SDK hängt. Der
      # Job selbst importiert ausschließlich flutterfreien Code
      # (fairness.dart, push_digest.dart, models/) und läuft mit `dart run`.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Refresh push outbox
        env:
          SUPABASE_URL: https://azrlhlcxhpwmxcinjovp.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::notice::Secrets are not configured — skipping."
            exit 0
          fi
          dart run tool/notify.dart
