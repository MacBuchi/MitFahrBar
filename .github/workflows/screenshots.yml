name: Screenshots

# Die README-Screenshots sind Erzeugnisse, keine gepflegten Bilder: Ändert
# ein PR die Oberfläche (lib/, assets/, web/), erzeugt dieser Workflow sie
# neu und schiebt sie in denselben Branch. So kann die README nicht von der
# App wegdriften, ohne dass es jemandem auffällt.
#
# Zwei Dinge sind Absicht:
#   · Der Job überspringt sich, wenn die Spitze schon sein eigener Commit
#     ist. Der Pfadfilter allein reicht dafür NICHT: Bei `pull_request`
#     zählt der gesamte PR-Diff, nicht der neue Commit — ein PR, der
#     `lib/` anfasst, triggert also auch nach dem Bot-Push wieder. Ohne
#     diesen Riegel liefe das im Kreis, sobald zwei Läufe verschiedene
#     Bilder erzeugen (etwa über Mitternacht: im Screenshot steht ein
#     Datum).
#   · Nach dem Push wird die CI von Hand angestoßen. Ein Push mit dem
#     GITHUB_TOKEN erzeugt bewusst keine neuen Ereignisse; ohne den
#     Dispatch hinge der PR ohne Required Checks fest (siehe github-flow).

on:
  pull_request:
    paths:
      - "lib/**"
      - "assets/**"
      - "web/**"
      - "tool/screenshots.mjs"
      - "tool/screenshots.sh"
      - ".github/workflows/screenshots.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

env:
  FLUTTER_VERSION: "3.41.2"

jobs:
  shots:
    name: Screenshots
    # Forks bekommen kein Schreibrecht — dort wäre der Push nur ein Fehler.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      # Der Riegel gegen die Schleife: Steht der eigene Commit schon oben,
      # ist nichts mehr zu tun. Alles Weitere hängt an diesem Schritt.
      - name: Läuft das im Kreis?
        id: guard
        run: |
          if [ "$(git log -1 --pretty=%s)" = 'docs: refresh README screenshots' ]; then
            echo "Spitze ist der eigene Commit — nichts zu tun."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - if: steps.guard.outputs.skip != 'true'
        run: flutter pub get
      - name: Screenshots erzeugen
        if: steps.guard.outputs.skip != 'true'
        run: ./tool/screenshots.sh
      # Geschrieben wird über die Contents-API, NICHT mit `git commit`:
      # `main` verlangt signierte Commits, und ein Commit aus dem Runner
      # trägt keine Signatur — er blockiert den ganzen PR, auch wenn jeder
      # Check grün ist (genau so lag PR #93 fest). Über die API committet
      # GitHub selbst und signiert dabei. Preis: ein Commit je Datei; beim
      # Squash-Merge bleibt davon ohnehin einer übrig.
      - name: Nur bei echter Änderung committen
        id: commit
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only -- doc/screenshots)
          if [ -z "$changed" ]; then
            echo "Screenshots unverändert."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Payload über stdin, NIE als Argument: Linux deckelt ein einzelnes
          # Argument bei 128 KB (MAX_ARG_STRLEN) — das Base64 einer PNG über
          # ~96 KB sprengt das, und der Lauf starb mitten in der Schleife
          # („Argument list too long", 25.07.2026). Halb committete
          # Screenshot-Sätze UND ein PR ohne Checks auf dem neuen Head
          # waren die Folge, weil auch der CI-Dispatch danach nie lief.
          for file in $changed; do
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$BRANCH" --jq .sha)
            base64 -w0 "$file" \
              | jq -R --slurp \
                  --arg msg 'docs: refresh README screenshots' \
                  --arg branch "$BRANCH" \
                  --arg sha "$sha" \
                  '{message: $msg, branch: $branch, sha: $sha,
                    content: (. | gsub("\\s"; ""))}' \
              | gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$file" \
                  --input - >/dev/null
            echo "committed $file"
          done
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: CI auf dem neuen Stand anstoßen
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run CI --ref "${{ github.head_ref || github.ref_name }}"
      - name: Bilder auch als Artefakt
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: doc/screenshots/*.png
