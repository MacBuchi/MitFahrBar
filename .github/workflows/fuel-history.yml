name: Fuel History Backfill

# Fills past weeks in `price_week` from the Tankerkönig price archive, for
# every region that has driven weeks without complete price rows.
#
# Scheduled nightly since v0.84.0. The schedule used to be deliberately
# absent because it needs a marker for weeks the archive will never have —
# without one, such a week stays a gap forever and the job re-downloads the
# same seven files every night. That marker now exists (`price_week_skip`,
# written and read only by this job via service_role). What made it real:
# trips edited or back-filled into formerly trip-free weeks, and a group's
# CSV import — both create gaps nobody re-dispatches by hand. 2023-W48 got
# a trip that way and dashed the savings chart for two and a half years.
#
# The run is bounded by `max_weeks`. Nothing is lost when it stops early: the
# work list is derived from the database (driven week without complete price
# rows, minus marked weeks), so the next run simply continues. An empty
# queue costs three selects and downloads nothing. Inactive until the
# secrets exist.
on:
  schedule:
    # Odd minute on purpose: GitHub sheds load-spike schedules (#115) —
    # fine here, "roughly once a night" is all this needs.
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      max_weeks:
        description: "Wochen pro Lauf (jede Woche = 7 Tagesdateien à ~30 MB)"
        required: false
        default: "100"
      dry_run:
        description: "Nur die Lücke anzeigen, nichts laden"
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    # 100 Wochen sind ~700 Dateien à 30 MB. Gemessen ~30 MB/s beim Archiv,
    # das Parsen dominiert — rund 25 Minuten. Das Dreifache als Reserve.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Backfill fuel price history
        env:
          # Der Job entscheidet über abgeschlossene Wochen — in deutscher
          # Zeit, wie rollup_fuel_weeks() auch.
          TZ: Europe/Berlin
          SUPABASE_URL: https://azrlhlcxhpwmxcinjovp.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TANKERKOENIG_ARCHIVE_USER: ${{ secrets.TANKERKOENIG_ARCHIVE_USER }}
          TANKERKOENIG_ARCHIVE_PASSWORD: ${{ secrets.TANKERKOENIG_ARCHIVE_PASSWORD }}
          # Über `env:` statt direkt im `run:`-Block: `${{ }}` wird VOR der
          # Shell ersetzt, eine Dispatch-Eingabe stünde dort also als Code.
          # `DRY_RUN` ist leer oder gesetzt — `${DRY_RUN:+--dry-run}` hängt
          # die Option nur im zweiten Fall an.
          # `|| '100'`: Bei `schedule:` ist jeder inputs.* LEER — ohne den
          # Rückfall stünde --max-weeks "" im Aufruf und argparse bräche
          # ab. Und zwar nur nachts, nie beim Hand-Dispatch.
          MAX_WEEKS: ${{ inputs.max_weeks || '100' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$TANKERKOENIG_ARCHIVE_PASSWORD" ]; then
            echo "::notice::Secrets für den Archivzugang fehlen — übersprungen."
            exit 0
          fi
          python3 tool/import_fuel_history.py \
            --max-weeks "$MAX_WEEKS" \
            ${DRY_RUN:+--dry-run}
