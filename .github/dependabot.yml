# Abhängigkeits-Updates. Bewusst gebündelt und monatlich:
#
# `pubspec.yaml` ist NICHT von der Version Guard ausgenommen, jeder pub-PR
# verlangt also einen Versions-Bump und veröffentlicht damit ein Release. Ohne
# `groups:` wären das bis zu fünf Releases im Monat nur für Abhängigkeiten.
# Mit Bündelung bleibt es ein PR — und die Guard-Regel darf bleiben, wie sie
# ist: Ein Dependency-Wechsel geht tatsächlich an die Gruppen raus.
#
# `.github/` ist ausgenommen, die Actions-PRs kommen also ohne Bump durch.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      pub-dependencies:
        patterns: ["*"]
    ignore:
      # Riverpod 2.x ist bewusst gepinnt (siehe CLAUDE.md): Unter 3.x
      # pausiert/resumed Riverpod Subscriptions beim Seitenwechsel und stößt
      # Provider-Invalidierungen mitten in der Build-Phase an
      # („setState during build"). Ein Major-Update ist Handarbeit.
      - dependency-name: "flutter_riverpod"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
