# config.toml – Konfiguration für die Supabase-GitHub-Integration UND den
# lokalen Test-Stack (`supabase start`, siehe doc/testbackend.md).
# Migrationen unter supabase/migrations/ werden bei Push auf main
# automatisch in das verbundene Projekt eingespielt; die Abschnitte darunter
# betreffen ausschließlich den lokalen Stack (Ports, Mail-Catcher) und haben
# auf Production keinen Einfluss.
project_id = "Fahrgemeinschaft"

# Eigener Port-Bereich (5532x statt 5432x), damit der Stack neben dem einer
# anderen App auf derselben Maschine laufen kann.
[api]
port = 55321

[db]
major_version = 17
port = 55322
shadow_port = 55320

[studio]
port = 55323

# Mailpit: fängt alle Auth-Mails (Bestätigung, Passwort-Reset) lokal ab —
# Web-UI und REST-API unter diesem Port. Grundlage der E2E-Mail-Tests.
[local_smtp]
port = 55324

# Log-Analytics braucht der Teststack nicht — spart einen Container.
[analytics]
enabled = false

# Standardlimit sind 2 Mails/Stunde — zu knapp für eine E2E-Suite, die
# Passwort-Reset-Mails real verschickt. Wirkt nur lokal.
[auth.rate_limit]
email_sent = 100

# Bestätigungspflicht wie in Production (dort seit dem Brevo-Setup am
# 23.07.2026 aktiv): Verwalter-Konten müssen den Code aus der
# Registrierungs-Mail eingeben. Gruppen-Konten entstehen deshalb NUR noch
# serverseitig über die Edge Function request-group (email_confirm) — ein
# Client-Signup bliebe an der unzustellbaren Fake-Adresse für immer hängen.
# Der Teststack spiegelt das bewusst, damit die E2E-Suite die Prod-Wahrheit
# prüft und dieser Drift nie wieder unbemerkt bleibt.
[auth.email]
enable_confirmations = true

# Aus demselben Grund die Mail-Vorlagen: Beide Wege laufen über den Code aus
# der Mail, nicht über deren Link (Issue #102) — der Link ist an das Gerät
# gebunden, das ihn angefordert hat. Ohne diese Verdrahtung verschickte der
# lokale Stack die Supabase-Standardvorlagen MIT Link, und die E2E-Suite
# prüfte einen Ablauf, den es in Production nicht gibt. Die Dateien sind die
# versionierten Kopien der Dashboard-Vorlagen; Änderungen gehören an beide
# Stellen (Prod-Seite überwacht tool/config_drift.sh).
[auth.email.template.confirmation]
subject = "MitFahrBar: Bitte bestätige deine Adresse"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "MitFahrBar: Code zum Zurücksetzen"
content_path = "./supabase/templates/recovery.html"

# Browser-E2E (tool/browser_e2e.sh, Issue #71): Der E-Mail-Wechsel bestätigt
# weiter per Link aus Mailpit und führt zurück in die lokal ausgelieferte
# Web-App. Wirkt nur lokal; die Dart-E2E-Suite folgt Redirects nie und bleibt
# davon unberührt.
[auth]
site_url = "http://localhost:8731"

# Deklariert für den lokalen Stack UND fürs Deployment über die
# GitHub-Integration (sie deployt die in config.toml deklarierten
# Functions). Nach einem Merge, der supabase/functions/ ändert, prüfen,
# ob die Function in Production angekommen ist — sonst manuell:
# `supabase functions deploy request-group --project-ref <ref>`.
#
# `verify_jwt` sortiert nur Aufrufe ohne jedes Token aus — es genügt NICHT
# als Zugangsschutz, weil der anon-Key selbst ein gültiges JWT ist. Seit #106
# prüft der Rumpf deshalb mit `getUser`, dass ein Verwalter-Konto mit
# bestätigtem Postfach ruft (401/403). Ohne diese Prüfung wäre der Endpunkt
# eine offene Gruppenfabrik.
[functions.request-group]
verify_jwt = true

# Bewusst ohne JWT-Prüfung: Der Versand-Job (tool/notify.dart auf GitHub
# Actions) hat keines — ein `sb_secret_*`-Service-Role-Key ist kein JWT mehr.
# Er weist sich stattdessen mit dem Header `x-push-secret` aus. Der zweite
# Aufrufer ist die App („Test-Benachrichtigung"), und für die prüft die
# Function das Nutzer-JWT selbst über die RLS. Beides steht explizit im
# Rumpf von index.ts.
[functions.send-push]
verify_jwt = false

# Ebenfalls ohne JWT-Prüfung, und aus demselben Grund: Der Aufruf kommt aus
# der Datenbank (pg_cron → pg_net) und hat keines. Ausweis ist derselbe
# Header `x-push-secret`. Ohne den Eintrag hier deployt die
# GitHub-Integration die Function nicht — und dann bleibt der Ausgangskorb
# stehen, ohne dass irgendwo ein Fehler auftaucht.
[functions.flush-push]
verify_jwt = false

# Hier dagegen MIT JWT-Prüfung: Es gibt keinen Aufrufer aus der Datenbank,
# und der Endpunkt befragt einen Fremddienst (Nominatim). Ohne die Prüfung
# wäre er ein offener Geokodierer auf fremde Kosten. Dass der anon-Key selbst
# ein gültiges JWT ist, wiegt hier leicht — es geht um öffentliche
# Ortsdaten, nicht um Gruppendaten.
[functions.geocode-place]
verify_jwt = true
